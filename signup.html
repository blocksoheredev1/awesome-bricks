<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login System</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #e00000;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box {
        width: 360px;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    h1 {
        text-align: center;
        margin-top: 0;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;

    input {
        width: 100%;

        border: 1px solid #aaa;
        border-radius: 4px;
        font-size: 15px;

    button {
        width: 100%;

        background: #111;

    .message {

<div class="box">

    <div id="login">
        <h1>Login</h1>

        <label>Username</label>
        <input id="loginUsername" type="text" maxlength="20">

        <label>Password</label>
        <input id="loginPassword" type="password">

        <button onclick="login()">Login</button>

        <button class="switch" onclick="showSignup()">
            Create account
        </button>

        <div id="loginMessage" class="message"></div>

];


/* =====================================================
   PÁGINAS
   ===================================================== */

function showSignup() {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("signup").classList.remove("hidden");
    clearMessages();
}

function showLogin() {
    document.getElementById("signup").classList.add("hidden");
    document.getElementById("login").classList.remove("hidden");
    clearMessages();
}

function clearMessages() {
    document.getElementById("loginMessage").textContent = "";
    document.getElementById("signupMessage").textContent = "";
}


/* =====================================================
   SIGNUP
   ===================================================== */

function signup() {

    const username =
        document.getElementById("signupUsername").value.trim();

    const password =
        document.getElementById("signupPassword").value;

    const key =
        document.getElementById("inviteKey").value.trim().toUpperCase();

    const message =
        document.getElementById("signupMessage");


    /* Username */

    const usernameRegex = /^[A-Za-z0-9_]{3,20}$/;

    if (!usernameRegex.test(username)) {
        message.textContent =
            "Invalid username.";

        return;
    }


    /* Password */

    if (password.length < 8) {
        message.textContent =
            "Password must have at least 8 characters.";

        return;
    }


    /* Invite key */

    if (!inviteKeys.includes(key)) {
        message.textContent =
            "Invalid invite key.";

        return;
    }


    /* Verifica se a key já foi usada */

    const usedKeys =
        JSON.parse(localStorage.getItem("usedInviteKeys") || "[]");

    if (usedKeys.includes(key)) {
        message.textContent =
            "This invite key has already been used.";

        return;
    }


    /* Verifica username existente */

    const users =
        JSON.parse(localStorage.getItem("users") || "[]");

    const usernameExists =
        users.some(user =>
            user.username.toLowerCase() === username.toLowerCase()
        );

    if (usernameExists) {
        message.textContent =
            "Username already exists.";

        return;
    }


    /* Cria conta */

    users.push({
        username: username,
        password: password
    });

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );


    /* Marca invite key como usada */

    usedKeys.push(key);

    localStorage.setItem(
        "usedInviteKeys",
        JSON.stringify(usedKeys)
    );


    message.textContent =
        "Account created successfully!";


    /* Limpa campos */

    document.getElementById("signupUsername").value = "";
    document.getElementById("signupPassword").value = "";
    document.getElementById("inviteKey").value = "";
}


/* =====================================================
   LOGIN
   ===================================================== */

function login() {

    const username =
        document.getElementById("loginUsername").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");


    const users =
        JSON.parse(localStorage.getItem("users") || "[]");


    const user =
        users.find(
            user =>
            user.username.toLowerCase() === username.toLowerCase()
            &&
            user.password === password
        );


    if (!user) {

        message.textContent =
            "Invalid username or password.";

        return;
    }


    message.textContent =
        "Login successful! Welcome " + user.username + "!";
}
