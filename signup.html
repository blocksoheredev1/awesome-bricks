<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Bricks - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 380px;
            max-width: 90%;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 28px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: #050505;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background: white;
            color: black;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ddd;
        }

        .secondary {
            background: #222;
            color: white;
            border: 1px solid #444;
            margin-top: 10px;
        }

        .secondary:hover {
            background: #333;
        }

        .message {
            min-height: 20px;
            margin: 12px 0;
            text-align: center;
            font-size: 14px;
        }

        .info {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }

        .logged-in {
            text-align: center;
        }

        .logged-in p {
            color: #ccc;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Awesome Bricks</h1>

    <!-- LOGIN -->
    <div id="loginPage">

        <h2>Login</h2>

        <label for="loginUsername">Username</label>
        <input
            type="text"
            id="loginUsername"
            maxlength="20"
            autocomplete="username"
            placeholder="Username"
        >

        <label for="loginPassword">Password</label>
        <input
            type="password"
            id="loginPassword"
            autocomplete="current-password"
            placeholder="Password"
        >

        <div id="loginMessage" class="message"></div>

        <button onclick="login()">
            Login
        </button>

        <button class="secondary" onclick="showSignup()">
            Create Account
        </button>

    </div>


    <!-- SIGNUP -->
    <div id="signupPage" class="hidden">

        <h2>Create Account</h2>

        <label for="signupUsername">Username</label>
        <input
            type="text"
            id="signupUsername"
            maxlength="20"
            autocomplete="username"
            placeholder="3-20 characters"
        >

        <label for="signupPassword">Password</label>
        <input
            type="password"
            id="signupPassword"
            autocomplete="new-password"
            placeholder="Minimum 8 characters"
        >

        <label for="signupEmail">
            Email (optional)
        </label>

        <input
            type="email"
            id="signupEmail"
            autocomplete="email"
            placeholder="Email (optional)"
        >

        <label for="inviteKey">
            Invite Key
        </label>

        <input
            type="text"
            id="inviteKey"
            placeholder="Enter invite key"
        >

        <div id="signupMessage" class="message"></div>

        <button onclick="signup()">
            Create Account
        </button>

        <button class="secondary" onclick="showLogin()">
            Back to Login
        </button>

        <div class="info">
            Username: 3-20 characters<br>
            Letters, numbers and _ only<br>
            Password: minimum 8 characters
        </div>

    </div>


    <!-- LOGGED IN -->
    <div id="loggedPage" class="hidden logged-in">

        <h2>Welcome!</h2>

        <p>
            You are logged in as:
        </p>

        <strong id="currentUsername"></strong>

        <button onclick="goToMain()">
            Continue
        </button>

        <button class="secondary" onclick="logout()">
            Logout
        </button>

    </div>

</div>


<script>

    /*
    ============================================================
    AWESOME BRICKS AUTH SYSTEM
    ============================================================
    Accounts are stored locally in the browser.
    ============================================================
    */


    // Main page
    const MAIN_PAGE =
        "https://blocksoheredev1.github.io/awesome-bricks/";


    // ----------------------------------------------------------
    // Storage
    // ----------------------------------------------------------

    const ACCOUNT_STORAGE = "awesomeBricksAccounts";
    const USED_KEYS_STORAGE = "awesomeBricksUsedKeys";
    const SESSION_STORAGE = "awesomeBricksLoggedUser";


    // ----------------------------------------------------------
    // Get saved accounts
    // ----------------------------------------------------------

    function getAccounts() {

        try {

            return JSON.parse(
                localStorage.getItem(ACCOUNT_STORAGE)
            ) || {};

        } catch {

            return {};

        }

    }


    // ----------------------------------------------------------
    // Save accounts
    // ----------------------------------------------------------

    function saveAccounts(accounts) {

        localStorage.setItem(
            ACCOUNT_STORAGE,
            JSON.stringify(accounts)
        );

    }


    // ----------------------------------------------------------
    // Get used invite keys
    // ----------------------------------------------------------

    function getUsedKeys() {

        try {

            return JSON.parse(
                localStorage.getItem(USED_KEYS_STORAGE)
            ) || [];

        } catch {

            return [];

        }

    }


    // ----------------------------------------------------------
    // Save used invite keys
    // ----------------------------------------------------------

    function saveUsedKeys(keys) {

        localStorage.setItem(
            USED_KEYS_STORAGE,
            JSON.stringify(keys)
        );

    }


    // ----------------------------------------------------------
    // Show Login
    // ----------------------------------------------------------

    function showLogin() {

        document
            .getElementById("loginPage")
            .classList.remove("hidden");

        document
            .getElementById("signupPage")
            .classList.add("hidden");

        document
            .getElementById("loggedPage")
            .classList.add("hidden");

        document.getElementById("loginMessage").textContent = "";

    }


    // ----------------------------------------------------------
    // Show Signup
    // ----------------------------------------------------------

    function showSignup() {

        document
            .getElementById("loginPage")
            .classList.add("hidden");

        document
            .getElementById("signupPage")
            .classList.remove("hidden");

        document
            .getElementById("loggedPage")
            .classList.add("hidden");

        document.getElementById("signupMessage").textContent = "";

    }


    // ----------------------------------------------------------
    // Username validation
    // ----------------------------------------------------------

    function validUsername(username) {

        /*
        3-20 characters
        Only letters, numbers and _
        */

        return /^[A-Za-z0-9_]{3,20}$/.test(username);

    }


    // ----------------------------------------------------------
    // Signup
    // ----------------------------------------------------------

    function signup() {

        const username =
            document
                .getElementById("signupUsername")
                .value
                .trim();

        const password =
            document
                .getElementById("signupPassword")
                .value;

        const email =
            document
                .getElementById("signupEmail")
                .value
                .trim();

        const inviteKey =
            document
                .getElementById("inviteKey")
                .value
                .trim()
                .toUpperCase();


        const message =
            document.getElementById("signupMessage");


        // Username
        if (!validUsername(username)) {

            message.textContent =
                "Username must be 3-20 characters and use only letters, numbers and _.";

            return;
        }


        // Password
        if (password.length < 8) {

            message.textContent =
                "Password must contain at least 8 characters.";

            return;
        }


        // Email is optional
        if (
            email !== "" &&
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
        ) {

            message.textContent =
                "Please enter a valid email.";

            return;
        }


        // Invite key
        if (inviteKey === "") {

            message.textContent =
                "Please enter an invite key.";

            return;
        }


        // Check invite key
        if (!INVITE_KEYS.includes(inviteKey)) {

            message.textContent =
                "Invalid invite key.";

            return;
        }


        // Check if key was already used
        const usedKeys = getUsedKeys();

        if (usedKeys.includes(inviteKey)) {

            message.textContent =
                "This invite key has already been used.";

            return;
        }


        // Get accounts
        const accounts = getAccounts();


        // Username already exists
        if (
            Object.keys(accounts)
                .some(
                    name =>
                        name.toLowerCase() ===
                        username.toLowerCase()
                )
        ) {

            message.textContent =
                "This username is already taken.";

            return;
        }


        // Create account
        accounts[username] = {

            username: username,

            password: password,

            email: email,

            createdAt: new Date().toISOString()

        };


        saveAccounts(accounts);


        // Mark invite key as used
        usedKeys.push(inviteKey);

        saveUsedKeys(usedKeys);


        // Login automatically
        localStorage.setItem(
            SESSION_STORAGE,
            username
        );


        // Go to main page
        goToMain();

    }


    // ----------------------------------------------------------
    // Login
    // ----------------------------------------------------------

    function login() {

        const username =
            document
                .getElementById("loginUsername")
                .value
                .trim();

        const password =
            document
                .getElementById("loginPassword")
                .value;


        const message =
            document.getElementById("loginMessage");


        const accounts = getAccounts();


        // Find username ignoring uppercase/lowercase
        const realUsername =
            Object.keys(accounts).find(
                name =>
                    name.toLowerCase() ===
                    username.toLowerCase()
            );


        if (!realUsername) {

            message.textContent =
                "Username or password is incorrect.";

            return;

        }


        if (
            accounts[realUsername].password !==
            password
        ) {

            message.textContent =
                "Username or password is incorrect.";

            return;

        }


        // Save session
        localStorage.setItem(
            SESSION_STORAGE,
            realUsername
        );


        // Redirect
        goToMain();

    }


    // ----------------------------------------------------------
    // Go to Main Page
    // ----------------------------------------------------------

    function goToMain() {

        window.location.href = MAIN_PAGE;

    }


    // ----------------------------------------------------------
    // Logout
    // ----------------------------------------------------------

    function logout() {

        localStorage.removeItem(
            SESSION_STORAGE
        );

        showLogin();

    }


    // ----------------------------------------------------------
    // Check session
    // ----------------------------------------------------------

    function checkSession() {

        const loggedUser =
            localStorage.getItem(
                SESSION_STORAGE
            );


        if (loggedUser) {

            document
                .getElementById("loginPage")
                .classList.add("hidden");

            document
                .getElementById("signupPage")
                .classList.add("hidden");

            document
                .getElementById("loggedPage")
                .classList.remove("hidden");

            document
                .getElementById("currentUsername")
                .textContent = loggedUser;

        }

    }

    // 3. Remova a parte que adiciona a key em usedKeys.
    //

        "X5NL-9KTB-3QWA",
        "Y7RP-4MZX-8KDC",

        "D2LP-9XVA-4KMC",

        "P3XM-7KQA-8VND",
        "Q8LR-4WTP-6KZX",

        "V9QP-5KDM-7XRA",

        "X2KR-9MTA-5QWC",

        "E5ZR-7KVD-2QNA"

    ];


    // Check if someone is already logged in
    checkSession();

</script>

</body>
</html>
