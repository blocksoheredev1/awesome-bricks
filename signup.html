<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

.signup-box {
    width: 360px;
    padding: 30px;
    background: #222;
    border-radius: 8px;
}

h1 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;

    background: #111;
    color: white;

    border: 1px solid #555;
    border-radius: 5px;
}

button {
    width: 100%;
    padding: 12px;

    background: white;
    color: black;

    border: none;
    border-radius: 5px;

    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ddd;
}

#message {
    text-align: center;
    margin-top: 15px;
}

.error {
    color: #ff5555;
}

.success {
    color: #55ff77;
}

.info {
    margin-top: 15px;
    text-align: center;
    color: #888;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="signup-box">

<h1>Sign Up</h1>

<form id="signupForm">

<label for="username">Username</label>

<input
    id="username"
    type="text"
    minlength="3"
    maxlength="20"
    placeholder="Username"
    required
>

<label for="email">Email (optional)</label>

<input
    id="email"
    type="email"
    placeholder="Email"
>

<label for="password">Password</label>

<input
    id="password"
    type="password"
    minlength="8"
    placeholder="Password"
    required
>

<label for="invite">Invite Key</label>

<input
    id="invite"
    type="text"
    placeholder="Invite Key"
    required
>

<button type="submit">
Create Account
</button>

</form>

<div id="message"></div>

<div class="info">
Username: 3–20 characters<br>
Only letters, numbers and _
</div>

</div>

/* ==================================================
   SIGNUP
================================================== */

const form = document.getElementById("signupForm");

const message = document.getElementById("message");


form.addEventListener("submit", function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const invite =
        document.getElementById("invite").value.trim();


    /* USERNAME */

    if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {

        message.textContent =
            "Username must be 3-20 characters and only use letters, numbers and _.";

        message.className = "error";

        return;
    }


    /* PASSWORD */

    if (password.length < 8) {

        message.textContent =
            "Password must contain at least 8 characters.";

        message.className = "error";

        return;
    }


    /* USED KEYS */

    let usedKeys = JSON.parse(
        localStorage.getItem("usedInviteKeys") || "[]"
    );


    /* ALL KEYS USED */

    if (usedKeys.length >= TEST_KEYS.length) {

        message.textContent =
            "All the keys are used.";

        message.className = "error";

        return;
    }


    /* INVALID KEY */

    if (!TEST_KEYS.includes(invite)) {

        message.textContent =
            "Invalid invite key.";

        message.className = "error";

        return;
    }


    /* KEY ALREADY USED */

    if (usedKeys.includes(invite)) {

        message.textContent =
            "This invite key has already been used.";

        message.className = "error";

        return;
    }


    /* ACCOUNTS */

    let accounts = JSON.parse(
        localStorage.getItem("accounts") || "[]"
    );


    /* USERNAME EXISTS */

    if (
        accounts.some(
            account =>
                account.username.toLowerCase()
                === username.toLowerCase()
        )
    ) {

        message.textContent =
            "This username is already taken.";

        message.className = "error";

        return;
    }


    /* CREATE ACCOUNT */

    accounts.push({
        username: username,
        email: email,
        password: password
    });


    localStorage.setItem(
        "accounts",
        JSON.stringify(accounts)
    );


    /* MARK KEY USED */

    usedKeys.push(invite);

    localStorage.setItem(
        "usedInviteKeys",
        JSON.stringify(usedKeys)
    );


    message.textContent =
        "Account created successfully!";

    message.className = "success";

    form.reset();


    /* LAST KEY */

    if (usedKeys.length >= TEST_KEYS.length) {

        message.textContent =
            "All the keys are used.";

        message.className = "error";
    }

});

</script>

</body>
</html>
